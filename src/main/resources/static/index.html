<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>工作台 · 文档系统</title>
    <link rel="stylesheet" href="vendor/vditor/dist/index.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登录视图 -->
<div id="login-view" class="hidden">
    <form id="login-form" class="login-card">
        <div class="login-logo">📘</div>
        <h1>工作台 · 文档系统</h1>
        <input type="password" id="login-password" placeholder="请输入访问密码" autocomplete="current-password" autofocus>
        <button type="submit" id="login-btn">登 录</button>
        <div id="login-error" class="login-error"></div>
    </form>
</div>

<!-- 主应用视图 -->
<div id="app-view" class="hidden">
    <header class="topbar">
        <button id="btn-menu" class="icon-btn menu-btn" title="菜单">☰</button>
        <div class="title-wrap">
            <span class="app-name">工作台</span>
            <span id="doc-title" class="doc-title">未打开文档</span>
        </div>
        <div class="topbar-actions">
            <button id="btn-save" class="top-btn primary" title="Ctrl+S">保存</button>
            <button id="btn-today" class="top-btn" title="打开/创建今日工作日志">今日工作</button>
            <button id="btn-open-local" class="top-btn" title="选择本地 .md 文件在浏览器中预览">打开本地文件</button>
            <button id="btn-logout" class="top-btn" title="退出登录">登出</button>
        </div>
    </header>

    <div class="layout">
        <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

        <aside id="sidebar" class="sidebar">
            <div class="search-row">
                <input type="search" id="search-input" placeholder="搜索文档…">
                <button id="btn-search" class="icon-btn" title="搜索">🔍</button>
            </div>

            <div id="tree-panel" class="tree-panel">
                <div class="tree-actions">
                    <button id="btn-new-file" class="mini-btn" title="在根目录新建文档">📄 新文档</button>
                    <button id="btn-new-dir" class="mini-btn" title="在根目录新建文件夹">📁 新文件夹</button>
                    <button id="btn-refresh" class="icon-btn" title="刷新">⟳</button>
                </div>
                <div id="tree-container" class="tree-container"></div>
            </div>

            <div id="search-results" class="search-results hidden">
                <div class="search-results-head">
                    <span id="search-summary">结果</span>
                    <button id="btn-back-tree" class="mini-btn">← 返回</button>
                </div>
                <div id="search-list" class="search-list"></div>
            </div>
        </aside>

        <main class="main-area">
            <div id="editor" class="editor"></div>

            <div id="local-preview" class="local-preview hidden">
                <div class="lp-bar">
                    <span id="lp-title" class="lp-title">本地文件预览</span>
                    <span class="lp-tip">（文件仅在浏览器中打开，未上传）</span>
                    <div class="lp-actions">
                        <button id="btn-lp-import" class="top-btn primary">导入到文档库</button>
                        <button id="btn-lp-close" class="top-btn">关闭</button>
                    </div>
                </div>
                <div id="lp-content" class="lp-content"></div>
            </div>
        </main>
    </div>
</div>

<!-- 拖拽提示遮罩 -->
<div id="drop-overlay" class="drop-overlay hidden">
    <div class="drop-box">📥 松开以预览 Markdown 文件</div>
</div>

<!-- 通用对话框 -->
<div id="dialog" class="modal hidden">
    <div class="modal-card">
        <div id="dialog-title" class="modal-title"></div>
        <div id="dialog-message" class="modal-message hidden"></div>
        <input id="dialog-input" class="modal-input hidden" type="text" autocomplete="off">
        <div class="modal-actions">
            <button id="dialog-cancel" class="top-btn">取消</button>
            <button id="dialog-ok" class="top-btn primary">确定</button>
        </div>
    </div>
</div>

<div id="toast" class="toast hidden"></div>

<input type="file" id="local-file-input" accept=".md,.markdown,.txt" class="hidden">

<script src="vendor/vditor/dist/index.min.js"></script>
<script src="app.js" defer></script>
</body>
</html>
