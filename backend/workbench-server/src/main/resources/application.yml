server:
  port: ${SERVER_PORT:8080}

spring:
  threads:
    virtual:
      # 文件 IO 型负载，虚拟线程低开销
      enabled: true

springdoc:
  api-docs:
    # 生产环境可置 false 关闭接口文档
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html

workbench:
  storage:
    # 文档库存储目录（中性配置键，环境变量仍为 DOCS_ROOT），建议指向持久化路径
    root: ${DOCS_ROOT:./data/docs}
  cors:
    # 允许的前端来源，逗号分隔
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  auth:
    # 轻量 Token 认证：非空时 /api/** 须带 X-API-Token 请求头；空 = 关闭（本地开发默认态）
    token: ${API_TOKEN:}
  metrics:
    # 监测时序数据目录（按天 JSONL 滚动）
    data-dir: ${METRICS_DATA:./data/metrics}
    retention-days: 14
    flush-interval-seconds: 5
  sources:
    # 数据源配置页（M6）：接入清单持久化文件 + GitHub token（只读 PAT，环境变量注入，不落盘）
    # cron 默认每天 08:05/20:05 各拉一次（GitHub 流量本身是日粒度），配 "-" 可关闭定时只留手动采集
    file: ${SOURCES_FILE:./data/sources.json}
    github-token: ${GITHUB_TOKEN:}
    cron: ${SOURCES_CRON:0 5 8,20 * * *}

logging:
  level:
    root: info
