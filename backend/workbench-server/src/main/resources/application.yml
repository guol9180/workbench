server:
  port: ${SERVER_PORT:8080}

spring:
  threads:
    virtual:
      # 文件 IO 型负载，虚拟线程低开销
      enabled: true

springdoc:
  api-docs:
    # 生产环境可置 false 关闭接口文档
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html

workbench:
  auth:
    # 密码登录（人类）：AUTH_PASSWORD_SHA256 = 登录密码的 SHA-256 hex（echo -n '密码' | sha256sum）；非空 = 开启认证
    password-sha256: ${AUTH_PASSWORD_SHA256:}
    # 机器凭据（ingest 外部上报）：API_TOKEN 非空时外部系统可带 X-API-Token 直连
    machine-token: ${API_TOKEN:}
    # 会话时长（小时）；会话存内存，容器重启即失效
    session-ttl-hours: 168
  metrics:
    # 观测时序数据目录（按天 JSONL 滚动）
    data-dir: ${METRICS_DATA:./data/metrics}
    retention-days: 14
    flush-interval-seconds: 5
  sources:
    # 数据源配置：接入清单 + GitHub token（页面设置优先于环境变量，持久化于该文件）
    # cron 默认每天 08:05/20:05 各拉一次（GitHub 流量本身是日粒度），配 "-" 可关闭定时只留手动采集
    file: ${WORKBENCH_SOURCES_FILE:./data/sources.json}
    github-token: ${GITHUB_TOKEN:}
    cron: ${SOURCES_CRON:0 5 8,20 * * *}

logging:
  level:
    root: info
