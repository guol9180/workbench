services:
  workbench:
    build: .
    container_name: workbench
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 部署前务必修改密码
      APP_PASSWORD: workbench123
      DOCS_ROOT: /data/docs
      SERVER_PORT: "8080"
    volumes:
      - workbench-docs:/data/docs

volumes:
  workbench-docs:
