services:
  workbench:
    # 方式一：在服务器上直接构建（2核2G 服务器跑 Maven 编译较吃力，建议用方式二）
    build: ./backend
    # 方式二：使用 GitHub Actions 推送到 GHCR 的镜像（打 tag 后自动构建）
    # image: ghcr.io/<你的用户名>/workbench:latest
    container_name: workbench
    ports:
      - "8080:8080"
    environment:
      - APP_PASSWORD=${APP_PASSWORD:-workbench123}
      # Token 签名密钥：务必改成随机长字符串，否则每次重启后需重新登录
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-please-change-me-to-a-long-random-string}
      # 允许的前端来源（你的 GitHub Pages 地址），逗号分隔；默认放行所有来源
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - DOCS_ROOT=/data/docs
    volumes:
      - workbench-docs:/data/docs
    mem_limit: 1g
    restart: unless-stopped

volumes:
  workbench-docs:
