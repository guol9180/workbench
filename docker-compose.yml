services:
  workbench:
    # 镜像由 GitHub Actions 在打 tag 时自动构建推送（.github/workflows/build-backend.yml）
    image: ghcr.io/guol9180/workbench:latest
    # 备选：服务器上直接构建（2核2G 跑 Maven 编译较吃力，不推荐）
    # build: ./backend
    container_name: workbench
    ports:
      # 仅绑定本机回环，外部流量统一走 Caddy HTTPS 反代
      - "127.0.0.1:8080:8080"
    environment:
      - APP_PASSWORD=${APP_PASSWORD:-workbench123}
      # Token 签名密钥：务必改成随机长字符串，否则每次重启后需重新登录
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-please-change-me-to-a-long-random-string}
      # 允许的前端来源；默认 * 放行所有来源，可收紧为 https://workbench.imhgl.com
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - DOCS_ROOT=/data/docs
    volumes:
      - workbench-docs:/data/docs
    mem_limit: 1g
    restart: unless-stopped

  # HTTPS 反向代理：自动申请并续期 api.imhgl.com 的证书（需放行 80/443）
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    mem_limit: 128m
    restart: unless-stopped

volumes:
  workbench-docs:
  caddy_data:
