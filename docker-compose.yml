# 生产部署：打 v* 标签 → Actions 构建并推送两个镜像（后端 :latest、前端 :frontend）→ 服务器 pull。
# 单域名同源：Caddy 托管前端静态产物，/api 反代到后端；无 CORS、无数据库。
services:
  workbench:
    image: ghcr.io/guol9180/workbench:latest
    container_name: workbench
    ports:
      # 仅绑定本机回环，外部流量统一走 Caddy HTTPS
      - "127.0.0.1:8080:8080"
    environment:
      # 登录密码哈希：必填。先生成密码，再取其 SHA-256（echo -n '密码' | sha256sum）；置空/删除 = 关闭认证
      - AUTH_PASSWORD_SHA256=${AUTH_PASSWORD_SHA256:?请在同目录 .env 中设置（生成方式见 .env.example）}
      # 可选机器凭据（ingest 外部上报静态携带）；不用可留空或删除
      - API_TOKEN=${API_TOKEN:-}
      # 时序数据与源配置持久化——不挂卷则容器重建即丢
      - METRICS_DATA=/data/runtime/metrics
      - WORKBENCH_SOURCES_FILE=/data/runtime/sources.json
    volumes:
      - workbench-runtime:/data/runtime
    mem_limit: 768m
    restart: unless-stopped

  # 前端静态产物 + HTTPS 反代：镜像由 frontend/Dockerfile 构建（dist 已打进 /srv/frontend）
  caddy:
    image: ghcr.io/guol9180/workbench:frontend
    container_name: workbench-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    restart: unless-stopped

volumes:
  workbench-runtime:
  caddy_data:
  caddy_config:
